name: Generate and Deploy Gemini Content to Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate Docs using Reusable Action
        uses: ./ # Uses the action from the current repository
        with:
          gemini_api_key: ${{ secrets.GEMINI_API_KEY }}

      - name: Setup Pandoc
        uses: r-lib/actions/setup-pandoc@v2

      - name: Convert markdown to html
        run: |
            mkdir -p pages
            if [ -f "pages/index.md" ]; then
                pandoc -s pages/index.md -o pages/index.html --metadata title="Project Autodocs" --css=https://cdn.simplecss.org/simple.min.css
            else
                echo "Error: pages/index.md not found!"
                exit 1
            fi

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload generated autodocs markdown
        uses: actions/upload-artifact@v4
        with:
          name: gemini-generated-autodocs
          path: pages/index.md

      - name: Upload pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'pages'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
